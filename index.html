let state={page:"landing",session:null,myNumber:null,mbti:null,answers:[],channel:null,teacher:false};
const urlParams=new URLSearchParams(location.search);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function setRoom(v){const el=document.getElementById("code");if(el)el.textContent=v||"----";}
function showMain(h){document.getElementById("main").innerHTML=h;}
function ensureClient(){const k=getKey();if(k){initSupabase(k);return true;}return false;}
function keySetup(after){
 showMain(`<section class="card center"><h2>🔑 처음 한 번만 연결하면 돼요</h2><p>Supabase의 <b>Publishable key</b>를 붙여넣어 주세요.<br>이 키는 공개용 키라 웹앱에서 사용하는 방식입니다.</p><input id="keyInput" type="text" placeholder="sb_publishable_..." style="width:100%;padding:14px;border-radius:12px;border:2px solid #8d7446;font-size:16px"><button class="btn" onclick="saveAndContinue()">✅ 저장하고 계속</button><p class="muted">처음 한 번만 키를 붙여넣으면 됩니다. 이후에는 이 기기에 기억됩니다.</p></section>`);
 window.__afterKey=after;
}
function saveAndContinue(){const k=(document.getElementById("keyInput")?.value||"").trim();if(!k){alert("Publishable key를 붙여넣어 주세요.");return;}saveKey(k);initSupabase(k);const f=window.__afterKey;window.__afterKey=null;f();}
function startTeacherMode(){state.teacher=true;state.page="teacher";render();}
function startStudentMode(){state.teacher=false;state.page="student";render();}
function makeCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
async function createSession(){
 if(!ensureClient()){keySetup(createSession);return;}
 const room=makeCode();
 const {data,error}=await supabaseClient.from("class_sessions").insert({room_code:room,active:true}).select().single();
 if(error){showMain(`<section class="card center"><h2>⚠️ 수업방을 만들지 못했어요.</h2><p>${esc(error.message)}</p><button class="btn" onclick="startTeacherMode()">다시 시도</button></section>`);return;}
 state.session=data;setRoom(room);
 const joinUrl=location.href.split("?")[0]+"?room="+encodeURIComponent(room)+"&k="+encodeURIComponent(getKey());
 showMain(`<section class="card center"><h2>🎮 수업방이 만들어졌어요!</h2><div class="notice"><div class="pixel">ROOM CODE</div><div style="font-size:68px;color:#ffd85b;font-weight:900;letter-spacing:8px">${room}</div><p>학생들에게 이 코드를 알려주세요.</p></div><div style="max-width:270px;margin:20px auto;background:#fff;padding:10px;border-radius:16px"><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}" alt="수업 참여 QR" style="width:100%;display:block"></div><p class="muted">학생은 QR을 찍거나 수업 코드로 참여하면 됩니다.</p><button class="btn" onclick="copyJoinLink()">🔗 참여 링크 복사</button><button class="btn" onclick="teacherDashboard()">📊 우리 반 결과 보기</button><button class="btn dark" onclick="closeSession()">🛑 수업방 종료</button></section><section class="card"><h2>🌳 현재 참여 현황</h2><div id="teacherResults">아직 검사 완료 학생이 없어요.</div></section>`);
 await teacherDashboard();subscribeToSession();
}
async function teacherDashboard(){
 if(!state.session)return;
 const {data,error}=await supabaseClient.from("student_results").select("student_number,mbti,plant_name").eq("session_id",state.session.id).order("student_number");
 const box=document.getElementById("teacherResults");if(!box)return;if(error){box.innerHTML=`오류: ${esc(error.message)}`;return;}
 box.innerHTML=(data&&data.length)?data.map(r=>`<span class="badge" style="font-size:17px;margin:5px;display:inline-block">🧑‍🎓 ${r.student_number}번 · ${P[r.mbti]?.[1]||"🌱"} ${esc(r.plant_name)}</span>`).join(""):"아직 검사 완료 학생이 없어요.";
}
function copyJoinLink(){const url=location.href.split("?")[0]+"?room="+encodeURIComponent(state.session.room_code)+"&k="+encodeURIComponent(getKey());navigator.clipboard?.writeText(url).then(()=>alert("학생 참여 링크를 복사했어요.")).catch(()=>prompt("아래 주소를 복사해 주세요.",url));}
async function closeSession(){if(!state.session)return;if(!confirm("이 수업방을 종료할까요?"))return;await supabaseClient.from("class_sessions").update({active:false}).eq("id",state.session.id);if(state.channel){await supabaseClient.removeChannel(state.channel);state.channel=null;}state={page:"landing",session:null,myNumber:null,mbti:null,answers:[],channel:null,teacher:false};setRoom("----");render();}
function studentView(){const preset=urlParams.get("room")||"";return `<section class="card center"><h2>🧑‍🎓 수업 참여</h2><p class="muted">선생님에게 받은 수업 코드를 입력하고 내 번호를 선택하세요.</p><input id="roomCodeInput" value="${esc(preset.toUpperCase())}" maxlength="8" placeholder="예: A7K3" style="font-size:26px;text-align:center;text-transform:uppercase"><select id="studentNoInput" style="font-size:22px;text-align:center">${Array.from({length:40},(_,i)=>`<option value="${i+1}">${i+1}번</option>`).join("")}</select><button class="btn" onclick="joinSession()">🌱 참여하기</button><div id="studentMsg" class="notice" style="display:none"></div></section>`;}
async function joinSession(){
 const k=urlParams.get("k");if(k){saveKey(k);initSupabase(k);}else if(!ensureClient()){keySetup(joinSession);return;}
 const room=(document.getElementById("roomCodeInput")?.value||"").trim().toUpperCase();const no=Number(document.getElementById("studentNoInput")?.value||0);const msg=document.getElementById("studentMsg");if(!room||!no){if(msg){msg.style.display="block";msg.textContent="수업 코드와 번호를 확인해주세요.";}return;}
 const {data,error}=await supabaseClient.from("class_sessions").select("*").eq("room_code",room).eq("active",true).maybeSingle();
 if(error||!data){if(msg){msg.style.display="block";msg.textContent="❌ 수업방을 찾을 수 없어요. 코드를 다시 확인해주세요.";}return;}
 state.session=data;state.myNumber=no;state.answers=[];setRoom(room);state.page="test";render();
}
function renderTest(){const i=state.answers.length,q=Q[i];return `<section class="card"><h2>🧠 식물 탐구 질문 ${i+1} / ${Q.length}</h2><div class="progress"><div style="width:${i/Q.length*100}%"></div></div><div class="question">${esc(q[0])}</div><div class="answers"><button class="answer" onclick="answer(0)">① ${esc(q[1][0])}</button><button class="answer" onclick="answer(1)">② ${esc(q[1][1])}</button></div><p class="center muted">정답은 없습니다. 지금 나에게 더 가까운 답을 골라주세요.</p></section>`;}
function answer(idx){state.answers.push(Q[state.answers.length][2][idx]);if(state.answers.length===Q.length)finishTest();else render();}
function calcMbti(){const pairs=[["E","I"],["S","N"],["T","F"],["J","P"]];return pairs.map(([a,b])=>{const ca=state.answers.filter(x=>x===a).length,cb=state.answers.filter(x=>x===b).length;return ca>=cb?a:b;}).join("");}
async function finishTest(){
 const mbti=calcMbti();state.mbti=mbti;const p=P[mbti];
 const {data,error}=await supabaseClient.from("student_results").upsert({session_id:state.session.id,student_number:state.myNumber,mbti,plant_name:p[0],plant_type:p[2]},{onConflict:"session_id,student_number"}).select().single();
 if(error){showMain(`<section class="card center"><h2>⚠️ 결과 저장에 문제가 있어요.</h2><p>${esc(error.message)}</p><button class="btn" onclick="startStudentMode()">다시 참여</button></section>`);return;}
 state.page="result";renderResult();subscribeToSession();
}
function renderResult(){const p=P[state.mbti],info=PLANT_INFO[p[0]],photo=PHOTO[p[0]];showMain(`<section class="card"><div class="plant"><div class="photo-wrap"><img class="plant-photo" src="${photo}" alt="${esc(p[0])} 사진" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="plant-fallback">${p[1]}</div><div class="photo-caption">📷 ${esc(p[0])}의 실제 모습을 살펴보세요</div></div><div><div class="pixel">YOUR PLANT</div><h2>✨ 너와 어울리는 식물은...</h2><h1>${p[1]} ${esc(p[0])}</h1><h3>${state.mbti} · ${esc(p[2])}</h3><p>${esc(p[3])}</p><div class="traits"><span class="trait">🌱 ${esc(p[2])}</span><span class="trait">🔎 탐구 성향 발견</span></div><div class="notice"><b>🌿 식물 한 줄 도감</b><br>${esc(info[0])}<br><br>${esc(info[1])}</div><div class="notice"><b>🔬 관찰 포인트</b><br>${esc(info[2])}<br><b>오늘의 미션:</b> 사진 속 식물의 잎·줄기·꽃 중 한 가지를 자세히 관찰해 보세요.</div></div></div></section><section class="card"><h2>💚 친구 궁합</h2><div id="compatArea">불러오는 중...</div></section><section class="card"><h2>🌳 우리 반 식물 정원</h2><div id="gardenArea">불러오는 중...</div></section>`);loadSharedViews();}
function score(a,b){let same=0;for(let i=0;i<4;i++)if(a[i]===b[i])same++;return Math.min(98,48+same*11+((a.charCodeAt(0)+b.charCodeAt(1))%7));}
async function loadSharedViews(){if(!state.session)return;const {data}=await supabaseClient.from("student_results").select("student_number,mbti,plant_name,plant_type").eq("session_id",state.session.id).order("student_number");const rows=data||[],others=rows.filter(x=>x.student_number!==state.myNumber);const c=document.getElementById("compatArea");if(c){if(!others.length)c.innerHTML="<p class='muted'>아직 등록된 친구가 없어요.</p>";else{const s=others.map(x=>({...x,v:score(state.mbti,x.mbti)})).sort((a,b)=>b.v-a.v);const best=s[0],worst=s[s.length-1];c.innerHTML=`<div class="compat">${s.map(r=>`<div class="pair"><h3>${r.v>=85?"💚 환상의 조합!":"🌿 탐구 조합"}</h3><p>${r.student_number}번 · ${P[r.mbti]?.[1]||"🌱"} ${esc(r.plant_name)}</p><div class="score">${r.v}%</div><div class="bar"><div style="width:${r.v}%"></div></div><p>${r.v>=85?"비슷한 탐구 성향이 많아요!":"서로 다른 점도 재미있는 탐구 재료!"}</p></div>`).join("")}</div><div class="notice"><b>🏆 오늘의 특별한 조합</b><br>💚 환상의 조합: ${best.student_number}번 · ${best.v}%<br>💥 환장의 조합: ${worst.student_number}번 · ${worst.v}%</div><div class="notice">🎯 <b>탐구 미션:</b> 한 친구를 골라 식물의 공통점 1가지와 다른 점 1가지를 찾아보세요.</div>`;}}
 const g=document.getElementById("gardenArea");if(g){const counts={};rows.forEach(x=>counts[x.plant_name]=(counts[x.plant_name]||0)+1);const vals=Object.entries(counts).sort((a,b)=>b[1]-a[1]);g.innerHTML=vals.length?`<div class="garden">${vals.map(([name,c])=>{const d=Object.values(P).find(x=>x[0]===name);return `<div class="pot"><div class="plantemoji">${d?.[1]||"🌱"}</div><b>${esc(name)}</b><div class="count">${c}명</div></div>`;}).join("")}</div>`:"<p class='muted'>아직 심어진 식물이 없어요.</p>";}
}
function subscribeToSession(){if(!state.session||state.channel)return;state.channel=supabaseClient.channel("room-"+state.session.id).on("postgres_changes",{event:"*",schema:"public",table:"student_results",filter:"session_id=eq."+state.session.id},()=>{if(state.teacher&&document.getElementById("teacherResults"))teacherDashboard();if(!state.teacher&&document.getElementById("compatArea"))loadSharedViews();}).subscribe();}
function render(){
 if(state.page==="landing"){setRoom("----");document.getElementById("classroomStart").classList.add("active");showMain(`<section class="card center"><div class="pixel">PLANT QUEST</div><h2>오늘의 식물 탐구를 시작해요!</h2><p class="subtitle">선생님이 수업방을 만들고 학생들이 함께 참여합니다.</p></section>`);return;}
 document.getElementById("classroomStart").classList.remove("active");
 if(state.page==="teacher"){setRoom("----");showMain(`<section class="card center"><h2>👩‍🏫 수업 시작</h2><p class="muted">새로운 수업방을 만들고 학생들에게 코드 또는 QR을 알려주세요.</p><button class="btn" onclick="createSession()">🎮 새 수업방 만들기</button><button class="btn purple" onclick="startStudentMode()">🧑‍🎓 학생 화면으로</button></section>`);return;}
 if(state.page==="student"){setRoom(urlParams.get("room")?.toUpperCase()||"----");showMain(studentView());return;}
 if(state.page==="test"){showMain(renderTest());return;}
 if(state.page==="result"){renderResult();return;}
}
render();
if(urlParams.get("room"))startStudentMode();
</script></body></html>
